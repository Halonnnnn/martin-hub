# PostgreSQL：单实例 StatefulSet + PVC。
# 如果集群已有托管数据库（RDS/云数据库），可删除本文件，
# 把 Secret 里的 DATABASE_URL 指向托管库即可。
apiVersion: v1
kind: Secret
metadata:
  name: martin-db
  namespace: martin
stringData:
  # 生产环境请改成强密码，并用 kubectl create secret 或外部 Secret 管理工具下发
  POSTGRES_USER: martin
  POSTGRES_PASSWORD: change-me-strong-password
  POSTGRES_DB: martin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: martin-env
  namespace: martin
data:
  MARTIN_DB_SCHEMA: martin
  MARTIN_HOST: 0.0.0.0
  MARTIN_PORT: "8000"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: martin-db
  namespace: martin
spec:
  serviceName: martin-db
  replicas: 1
  selector:
    matchLabels:
      app: martin-db
  template:
    metadata:
      labels:
        app: martin-db
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
              name: pg
          envFrom:
            - secretRef:
                name: martin-db
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: martin-db
  namespace: martin
spec:
  type: ClusterIP
  selector:
    app: martin-db
  ports:
    - port: 5432
      targetPort: pg
