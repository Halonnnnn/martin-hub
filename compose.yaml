name: martin

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-martin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-martin}
    volumes:
      # postgres 18 镜像的数据目录在 /var/lib/postgresql 下
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-martin} -d ${POSTGRES_DB:-martin}"]
      interval: 5s
      timeout: 3s
      retries: 20

  hub:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: martin-hub:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MARTIN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-martin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-martin}
      MARTIN_DB_SCHEMA: martin
      MARTIN_HOST: 0.0.0.0
      MARTIN_PORT: "8000"
      MARTIN_SECRET_KEY: ${MARTIN_SECRET_KEY:?请在 .env 中设置 MARTIN_SECRET_KEY}
    ports:
      - "${MARTIN_BIND:-0.0.0.0}:${MARTIN_PUBLISH_PORT:-8000}:8000"
    stop_grace_period: 15s

volumes:
  db-data:
